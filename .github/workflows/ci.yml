name: CI

# Once per change: on pull requests (and by hand from the Actions tab). Running on branch
# pushes as well ran every check twice for each push to an open pull request.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    # A normal run takes about 4 minutes; a hang fails here instead of running for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run size
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - name: Keep Playwright traces on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
